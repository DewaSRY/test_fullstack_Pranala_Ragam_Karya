services:
  psql_bp:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: product_db
      POSTGRES_USER: product_user
      POSTGRES_PASSWORD: product_password
    ports:
      - "5442:5432"
    volumes:
      - be_test_volume_bp:/var/lib/postgresql/data

volumes:
  be_test_volume_bp:
